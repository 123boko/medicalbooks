<div class="table-wrap" role="region" aria-label="Comparison table" tabindex="0">
<table>
  <thead>
    {{- range .THead }}
    <tr>
      {{- range . }}
      <th scope="col">{{ .Text }}</th>
      {{- end }}
    </tr>
    {{- end }}
  </thead>
  <tbody>
    {{- range .TBody }}
    <tr>
      {{- range . }}
      <td>{{ .Text }}</td>
      {{- end }}
    </tr>
    {{- end }}
  </tbody>
</table>
</div>
